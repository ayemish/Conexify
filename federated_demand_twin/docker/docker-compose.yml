# Federated Demand Forecasting + Bayesian Decision Twin MVP
# Docker Compose for end-to-end demo
# NFR-3.1: Entire system must be runnable on a laptop via Docker Compose

version: '3.8'

services:
  # ==========================================================================
  # Customer Environment (Behind Firewall)
  # ==========================================================================
  
  retailco-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.customer
    container_name: retailco-fl-client
    environment:
      - CLIENT_ID=retailco-client-1
      - FL_SERVER_ADDRESS=fl-server:8080
      - DATA_PATH=/app/data/customer
      - ENABLE_SECURE_AGGREGATION=${ENABLE_SECAGG:-false}
      - ENABLE_DIFFERENTIAL_PRIVACY=${ENABLE_DP:-false}
      - DP_EPSILON=${DP_EPSILON:-1.0}
      - LOCAL_EPOCHS=${LOCAL_EPOCHS:-3}
    volumes:
      - customer-data:/app/data/customer
      - customer-logs:/app/logs
      - shared-models:/app/models
    depends_on:
      - fl-server
    networks:
      - fl-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  # ==========================================================================
  # Vendor Cloud Services
  # ==========================================================================
  
  fl-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vendor
    container_name: fl-coordinator
    command: ["python", "-m", "vendor.fl_server.server"]
    environment:
      - SERVER_ADDRESS=0.0.0.0:8080
      - NUM_ROUNDS=${NUM_ROUNDS:-20}
      - MIN_CLIENTS=${MIN_CLIENTS:-1}
      - ENABLE_SECURE_AGGREGATION=${ENABLE_SECAGG:-false}
      - MODEL_REGISTRY_PATH=/app/models/registry
    ports:
      - "8080:8080"
    volumes:
      - model-registry:/app/models/registry
      - server-logs:/app/logs
    networks:
      - fl-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  bayesian-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vendor
    container_name: bayesian-engine
    command: ["python", "-m", "vendor.bayesian_engine.api"]
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8081
      - NUM_SAMPLES=${BAYES_SAMPLES:-2000}
      - CACHE_PATH=/app/cache/bayesian
    ports:
      - "8081:8081"
    volumes:
      - bayesian-cache:/app/cache/bayesian
      - shared-models:/app/models:ro
    networks:
      - vendor-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  optimizer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vendor
    container_name: inventory-optimizer
    command: ["python", "-m", "vendor.optimizer.api"]
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8082
      - SOLVER_TIME_LIMIT=${SOLVER_TIMEOUT:-30}
      - AUDIT_PATH=/app/logs/optimization_audit.json
    ports:
      - "8082:8082"
    volumes:
      - optimizer-logs:/app/logs
    networks:
      - vendor-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  digital-twin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vendor
    container_name: digital-twin
    command: ["python", "-m", "vendor.digital_twin.api"]
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8083
      - STATE_STORE_PATH=/app/data/twin_states
      - DEFAULT_SIMULATIONS=${TWIN_SIMULATIONS:-1000}
    ports:
      - "8083:8083"
    volumes:
      - twin-states:/app/data/twin_states
      - shared-models:/app/models:ro
    networks:
      - vendor-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  decision-orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.vendor
    container_name: decision-orchestrator
    command: ["python", "-m", "vendor.agents.api"]
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8084
      - BAYESIAN_URL=http://bayesian-engine:8081
      - OPTIMIZER_URL=http://optimizer:8082
      - TWIN_URL=http://digital-twin:8083
      - OUTPUT_PATH=/app/reports
    ports:
      - "8084:8084"
    volumes:
      - reports:/app/reports
      - orchestrator-logs:/app/logs
    depends_on:
      - bayesian-engine
      - optimizer
      - digital-twin
    networks:
      - vendor-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'

  # ==========================================================================
  # API Gateway (Optional - for unified access)
  # ==========================================================================
  
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bayesian-engine
      - optimizer
      - digital-twin
      - decision-orchestrator
    networks:
      - vendor-network

  # ==========================================================================
  # Observability (Optional)
  # ==========================================================================
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - vendor-network
    profiles:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vendor-network
    profiles:
      - observability

# ==========================================================================
# Networks
# ==========================================================================

networks:
  fl-network:
    driver: bridge
    name: federated-learning-network
  vendor-network:
    driver: bridge
    name: vendor-services-network

# ==========================================================================
# Volumes
# ==========================================================================

volumes:
  customer-data:
    name: retailco-customer-data
  customer-logs:
    name: retailco-customer-logs
  model-registry:
    name: fl-model-registry
  server-logs:
    name: fl-server-logs
  shared-models:
    name: shared-models
  bayesian-cache:
    name: bayesian-cache
  optimizer-logs:
    name: optimizer-logs
  twin-states:
    name: twin-states
  reports:
    name: decision-reports
  orchestrator-logs:
    name: orchestrator-logs
  prometheus-data:
    name: prometheus-data
  grafana-data:
    name: grafana-data
