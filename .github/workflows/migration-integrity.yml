name: Migration Integrity

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  alembic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Migration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic sqlalchemy pydantic pydantic-settings python-dotenv

      - name: Validate Alembic Lineage
        working-directory: predictive_maintenance
        env:
          PDM_DB_URL: sqlite:///migration_integrity.db
        run: |
          alembic heads
          alembic upgrade head --sql > /tmp/alembic_upgrade.sql
