# CrewAI Task Definitions for Retail Media Optimization
# Compatible with CrewAI project layouts

# =============================================================================
# BRAND LEVEL OPTIMIZATION TASKS
# =============================================================================

ingest_brand_data:
  description: |
    Ingest and validate brand performance data including:
    - Spend by RMN and channel
    - Incremental sales and attributed revenue
    - Efficiency metrics (iROAS, CPiS)
    - Historical trends and seasonality
    Confirm data quality and flag any issues.
  expected_output: "Data validation report with quality scores and any issues identified"
  agent: brand_performance_analyst
  async_execution: false

compute_brand_kpis:
  description: |
    Compute brand-level KPIs:
    - Total and incremental sales by RMN/channel
    - Spend efficiency (iROAS) by RMN/channel
    - Index vs benchmark
    - Contribution to total portfolio
    - Trend vs prior period and year-ago
  expected_output: "Brand KPI scorecard with rankings and contribution analysis"
  agent: brand_performance_analyst
  context: [ingest_brand_data]
  async_execution: false

validate_incrementality:
  description: |
    Validate incrementality methodology:
    - Review lift study results and confidence
    - Assess response curve saturation points
    - Identify marginal vs average return gaps
    - Flag any measurement concerns
  expected_output: "Incrementality validation report with confidence levels"
  agent: incrementality_analyst
  context: [compute_brand_kpis]
  async_execution: false

analyze_margin_mix:
  description: |
    Analyze margin and product mix:
    - Gross margin by product/SKU impacted
    - Mix shift opportunities
    - Price/promo interaction effects
    - Profitability vs volume tradeoffs
  expected_output: "Margin analysis with mix optimization opportunities"
  agent: margin_mix_analyst
  context: [compute_brand_kpis]
  async_execution: false

optimize_brand_allocation:
  description: |
    Optimize budget allocation:
    - Set objective function based on desired outcome
    - Apply response curves and diminishing returns
    - Solve for optimal allocation across RMNs/channels
    - Compute shadow prices for binding constraints
  expected_output: "Optimized allocation with expected impact"
  agent: budget_allocation_optimizer
  context: [validate_incrementality, analyze_margin_mix]
  async_execution: false

validate_brand_constraints:
  description: |
    Validate all constraints are satisfied:
    - Budget ceiling
    - RMN/channel floors and ceilings
    - Retailer commitment minimums
    - Brand safety requirements
    - Operational capacity limits
  expected_output: "Constraint validation report with any violations"
  agent: constraints_risk_manager
  context: [optimize_brand_allocation]
  async_execution: false

generate_brand_narrative:
  description: |
    Generate stakeholder narrative:
    - Executive summary of recommendations
    - Key findings (what's working, what's not)
    - Recommended actions with rationale
    - Expected impact and assumptions
    - Risks and mitigations
  expected_output: "Executive recommendation deck with action plan"
  agent: recommendation_narrator
  context: [validate_brand_constraints]
  async_execution: false

qa_brand_output:
  description: |
    QA the final output:
    - Verify all totals reconcile
    - Check unit consistency
    - Validate calculation accuracy
    - Ensure completeness
  expected_output: "QA sign-off with any corrections"
  agent: qa_auditor
  context: [generate_brand_narrative]
  async_execution: false

# =============================================================================
# RMN LEVEL OPTIMIZATION TASKS
# =============================================================================

ingest_rmn_data:
  description: |
    Ingest and validate RMN performance data:
    - Spend by channel and placement
    - Incremental sales and attributed revenue
    - Share of voice and competitive metrics
    - Auction dynamics (CPCs, CPMs, win rates)
    Confirm data quality and retailer-specific adjustments.
  expected_output: "RMN data validation report with quality scores"
  agent: rmn_performance_analyst
  async_execution: false

analyze_rmn_channel_performance:
  description: |
    Analyze RMN channel performance:
    - Search, Display, Video, Email channel KPIs
    - Efficiency and scale by channel
    - Saturation signals and headroom
    - Channel-specific trends
  expected_output: "Channel performance scorecard with rankings"
  agent: rmn_performance_analyst
  context: [ingest_rmn_data]
  async_execution: false

analyze_auction_dynamics:
  description: |
    Analyze RMN auction dynamics:
    - CPC/CPM trends and cost inflation
    - Competitive intensity by category
    - Share of voice trends
    - Bid efficiency opportunities
  expected_output: "Auction dynamics report with bidding recommendations"
  agent: auction_dynamics_specialist
  context: [ingest_rmn_data]
  async_execution: false

validate_rmn_incrementality:
  description: |
    Validate RMN incrementality:
    - Review lift study methodology
    - Assess confidence and sample size
    - Compare to other RMN methodologies
    - Flag measurement concerns
  expected_output: "Incrementality validation with confidence levels"
  agent: incrementality_analyst
  context: [analyze_rmn_channel_performance]
  async_execution: false

optimize_within_rmn:
  description: |
    Optimize allocation within RMN:
    - Set objective based on desired outcome
    - Apply channel-specific response curves
    - Solve for optimal channel mix
    - Recommend bidding/pacing posture
  expected_output: "Optimized within-RMN allocation"
  agent: budget_allocation_optimizer
  context: [validate_rmn_incrementality, analyze_auction_dynamics]
  async_execution: false

validate_retailer_constraints:
  description: |
    Validate retailer constraints:
    - Minimum spend commitments
    - Co-op funding rules
    - Inventory/availability constraints
    - Platform policy compliance
  expected_output: "Constraint validation with compliance status"
  agent: constraints_risk_manager
  context: [optimize_within_rmn]
  async_execution: false

generate_rmn_playbook:
  description: |
    Generate RMN action playbook:
    - Channel mix recommendations
    - Bidding and pacing guidance
    - Placement priorities
    - Test and learn opportunities
    - Risk mitigations
  expected_output: "Retailer-specific action playbook"
  agent: recommendation_narrator
  context: [validate_retailer_constraints]
  async_execution: false

# =============================================================================
# CAMPAIGN & MESSAGE LEVEL OPTIMIZATION TASKS
# =============================================================================

ingest_campaign_data:
  description: |
    Ingest and validate campaign performance data:
    - Spend, impressions, clicks, conversions by campaign
    - Incremental sales/profit if modeled
    - Creative/message metadata
    - Targeting parameters (audiences, keywords, products)
    Confirm data completeness and quality.
  expected_output: "Campaign data validation report"
  agent: campaign_performance_analyst
  async_execution: false

analyze_campaign_performance:
  description: |
    Analyze campaign performance:
    - Rank campaigns by efficiency and scale
    - Identify top performers for scale
    - Flag saturated or declining campaigns
    - Compute contribution to total
  expected_output: "Campaign performance scorecard with rankings"
  agent: campaign_performance_analyst
  context: [ingest_campaign_data]
  async_execution: false

analyze_targeting:
  description: |
    Analyze targeting effectiveness:
    - Audience segment performance
    - Keyword/product targeting efficiency
    - Demand capture vs demand creation mix
    - Expansion opportunities
  expected_output: "Targeting analysis with expansion recommendations"
  agent: audience_keyword_analyst
  context: [analyze_campaign_performance]
  async_execution: false

analyze_creative:
  description: |
    Analyze creative/message performance:
    - Creative fatigue signals
    - Message theme effectiveness
    - Format performance (static, video, carousel)
    - Refresh recommendations
  expected_output: "Creative analysis with refresh plan"
  agent: creative_message_analyst
  context: [analyze_campaign_performance]
  async_execution: false

design_experiments:
  description: |
    Design test plan:
    - A/B tests for underperforming elements
    - Multivariate tests for creative optimization
    - Sample size and duration requirements
    - Learning agenda priorities
  expected_output: "Experimentation plan with test definitions"
  agent: experimentation_designer
  context: [analyze_targeting, analyze_creative]
  async_execution: false

optimize_bidding_pacing:
  description: |
    Optimize bidding and pacing:
    - Bid adjustment recommendations
    - Pacing curve optimization
    - Dayparting opportunities
    - Budget reallocation within campaigns
  expected_output: "Bidding/pacing optimization plan"
  agent: bidding_pacing_specialist
  context: [analyze_campaign_performance]
  async_execution: false

generate_campaign_playbook:
  description: |
    Generate campaign action playbook:
    - Scale/pause/refresh decisions
    - Targeting changes
    - Creative updates
    - Bid/pacing adjustments
    - Test priorities
  expected_output: "Campaign optimization playbook"
  agent: recommendation_narrator
  context: [design_experiments, optimize_bidding_pacing]
  async_execution: false

# =============================================================================
# CHANNEL LEVEL OPTIMIZATION TASKS
# =============================================================================

ingest_channel_data:
  description: |
    Ingest and validate channel performance data:
    - Spend, incremental sales, efficiency by channel
    - Response curve parameters if available
    - Channel-specific metrics (CTR, CVR, CPM, CPC)
    - Historical trends and seasonality
  expected_output: "Channel data validation report"
  agent: channel_strategy_lead
  async_execution: false

analyze_search_channel:
  description: |
    Analyze Search channel performance:
    - Keyword portfolio performance
    - Bid efficiency and auction dynamics
    - Search term coverage and gaps
    - Scale opportunities and saturation
  expected_output: "Search channel analysis"
  agent: search_specialist
  context: [ingest_channel_data]
  async_execution: true

analyze_display_channel:
  description: |
    Analyze Display channel performance:
    - Audience segment performance
    - Placement efficiency
    - Frequency and reach optimization
    - Creative format performance
  expected_output: "Display channel analysis"
  agent: display_specialist
  context: [ingest_channel_data]
  async_execution: true

analyze_video_channel:
  description: |
    Analyze Video channel performance:
    - CTV vs online video performance
    - Completion rates and viewability
    - Frequency optimization
    - Creative performance by length/format
  expected_output: "Video channel analysis"
  agent: video_specialist
  context: [ingest_channel_data]
  async_execution: true

analyze_email_channel:
  description: |
    Analyze Email channel performance:
    - Open rates and click rates by segment
    - Send frequency optimization
    - Content and subject line performance
    - List health and deliverability
  expected_output: "Email channel analysis"
  agent: email_specialist
  context: [ingest_channel_data]
  async_execution: true

estimate_response_curves:
  description: |
    Estimate channel response curves:
    - Fit saturation curves to historical data
    - Identify marginal return at current spend
    - Estimate scale headroom per channel
    - Flag uncertainty in curve estimates
  expected_output: "Response curve estimates with confidence"
  agent: incrementality_analyst
  context: [analyze_search_channel, analyze_display_channel, analyze_video_channel, analyze_email_channel]
  async_execution: false

optimize_channel_mix:
  description: |
    Optimize cross-channel mix:
    - Set objective function for desired outcome
    - Apply response curves
    - Solve for optimal allocation
    - Report marginal returns at solution
  expected_output: "Optimized channel allocation"
  agent: budget_allocation_optimizer
  context: [estimate_response_curves]
  async_execution: false

generate_channel_playbooks:
  description: |
    Generate channel playbooks:
    - Tactical recommendations per channel
    - Levers to pull and in what order
    - Monitoring metrics and thresholds
    - Adjustment triggers and escalation
  expected_output: "Channel-specific playbooks"
  agent: recommendation_narrator
  context: [optimize_channel_mix]
  async_execution: false

# =============================================================================
# SCENARIO ORCHESTRATOR TASKS
# =============================================================================

intake_scenario:
  description: |
    Process scenario request:
    - Validate all required parameters
    - Resolve missing values with defaults
    - Confirm desired outcome and constraints
    - Identify scope (brands, RMNs, channels, time window)
  expected_output: "Validated scenario brief"
  agent: scenario_intake_analyst
  async_execution: false

route_objective:
  description: |
    Configure objective function:
    - Set primary objective based on desired outcome
    - Configure objective weights
    - Set KPI floors and ceilings
    - Define success metrics
  expected_output: "Objective function configuration"
  agent: objective_router
  context: [intake_scenario]
  async_execution: false

build_data_context:
  description: |
    Prepare data context:
    - Filter to scenario scope
    - Aggregate to optimization grain
    - Compute baseline metrics
    - Identify data gaps
  expected_output: "Data context for optimization"
  agent: scenario_intake_analyst
  context: [intake_scenario]
  async_execution: false

model_response_curves:
  description: |
    Estimate response curves:
    - Fit saturation curves to history
    - Estimate marginal returns
    - Quantify uncertainty bands
    - Flag low-confidence estimates
  expected_output: "Response curve estimates"
  agent: response_curve_modeler
  context: [build_data_context]
  async_execution: false

solve_optimization:
  description: |
    Solve for optimal allocation:
    - Run optimizer with objective and constraints
    - Report optimal allocation
    - Compute shadow prices
    - Identify binding constraints
  expected_output: "Optimization solution"
  agent: optimization_solver
  context: [model_response_curves, route_objective]
  async_execution: false

analyze_sensitivity:
  description: |
    Analyze solution robustness:
    - Sensitivity to input assumptions
    - Stress test key parameters
    - Monte Carlo on uncertain inputs
    - Flag fragile recommendations
  expected_output: "Sensitivity analysis"
  agent: sensitivity_robustness_analyst
  context: [solve_optimization]
  async_execution: false

compare_scenarios:
  description: |
    Compare baseline and optimized:
    - Compute deltas for all KPIs
    - Generate comparison tables
    - Identify key tradeoffs
    - Rank scenarios if multiple
  expected_output: "Scenario comparison"
  agent: scenario_comparator
  context: [analyze_sensitivity]
  async_execution: false

package_scenario_output:
  description: |
    Create final output:
    - Executive summary
    - Scenario plan with allocation
    - Comparison tables
    - Governance pack
    - QA validation
  expected_output: "Complete scenario output"
  agent: qa_auditor
  context: [compare_scenarios]
  async_execution: false
