# CrewAI Crew Definitions for Retail Media Optimization
# Compatible with CrewAI project layouts

# =============================================================================
# LEVEL CREWS - Optimization by analytical level
# =============================================================================

brand_optimization_crew:
  name: "Brand Level Optimization Crew"
  description: |
    Optimizes a brand portfolio's retail media spend mix across RMNs, channels,
    campaigns, and messages to achieve the desired outcome.
  process: sequential
  memory: true
  verbose: true
  agents:
    - brand_portfolio_lead
    - brand_performance_analyst
    - incrementality_analyst
    - margin_mix_analyst
    - budget_allocation_optimizer
    - constraints_risk_manager
    - recommendation_narrator
    - qa_auditor
  tasks:
    - ingest_brand_data
    - compute_brand_kpis
    - validate_incrementality
    - analyze_margin_mix
    - optimize_brand_allocation
    - validate_brand_constraints
    - generate_brand_narrative
    - qa_brand_output
  manager_llm: gpt-4
  function_calling_llm: gpt-4

rmn_optimization_crew:
  name: "RMN Level Optimization Crew"
  description: |
    Optimizes performance within and across RMNs (retailers) and translates
    recommendations into retailer-specific action plans.
    Each RMN gets its own crew instance.
  process: sequential
  memory: true
  verbose: true
  agents:
    - rmn_account_lead
    - rmn_performance_analyst
    - auction_dynamics_specialist
    - incrementality_analyst
    - budget_allocation_optimizer
    - constraints_risk_manager
    - recommendation_narrator
    - qa_auditor
  tasks:
    - ingest_rmn_data
    - analyze_rmn_channel_performance
    - analyze_auction_dynamics
    - validate_rmn_incrementality
    - optimize_within_rmn
    - validate_retailer_constraints
    - generate_rmn_playbook
  manager_llm: gpt-4
  function_calling_llm: gpt-4

campaign_message_optimization_crew:
  name: "Campaign & Message Level Optimization Crew"
  description: |
    Optimizes campaign structure, targeting, and message/creative strategy
    to improve efficiency and outcomes.
  process: sequential
  memory: true
  verbose: true
  agents:
    - campaign_ops_lead
    - campaign_performance_analyst
    - audience_keyword_analyst
    - creative_message_analyst
    - experimentation_designer
    - bidding_pacing_specialist
    - constraints_risk_manager
    - recommendation_narrator
    - qa_auditor
  tasks:
    - ingest_campaign_data
    - analyze_campaign_performance
    - analyze_targeting
    - analyze_creative
    - design_experiments
    - optimize_bidding_pacing
    - generate_campaign_playbook
  manager_llm: gpt-4
  function_calling_llm: gpt-4

channel_optimization_crew:
  name: "Channel Level Optimization Crew"
  description: |
    Optimizes within-channel levers and cross-channel mix,
    translating the optimized plan into channel playbooks.
  process: hierarchical
  memory: true
  verbose: true
  agents:
    - channel_strategy_lead
    - search_specialist
    - display_specialist
    - video_specialist
    - email_specialist
    - incrementality_analyst
    - budget_allocation_optimizer
    - constraints_risk_manager
    - recommendation_narrator
    - qa_auditor
  tasks:
    - ingest_channel_data
    - analyze_search_channel
    - analyze_display_channel
    - analyze_video_channel
    - analyze_email_channel
    - estimate_response_curves
    - optimize_channel_mix
    - generate_channel_playbooks
  manager_llm: gpt-4
  function_calling_llm: gpt-4

# =============================================================================
# SCENARIO CREWS - Objective-based optimization
# =============================================================================

scenario_orchestrator_crew:
  name: "Scenario Orchestrator Crew"
  description: |
    Run parameterized optimization scenarios end-to-end and
    produce comparable scenario outputs. Main entry point for production.
  process: hierarchical
  memory: true
  verbose: true
  agents:
    - scenario_director
    - scenario_intake_analyst
    - objective_router
    - response_curve_modeler
    - optimization_solver
    - sensitivity_robustness_analyst
    - scenario_comparator
    - qa_auditor
  tasks:
    - intake_scenario
    - route_objective
    - build_data_context
    - model_response_curves
    - solve_optimization
    - analyze_sensitivity
    - compare_scenarios
    - package_scenario_output
  manager_llm: gpt-4
  function_calling_llm: gpt-4

increase_revenue_crew:
  name: "Increase Revenue Crew"
  description: |
    Maximize incremental dollar sales.
    Primary objective: maximize incremental_sales
    Constraints: Spend ≤ budget; optional RMN/channel floors/ceilings
    KPIs: Incremental sales, iROAS, scale headroom, saturation signals
  extends: scenario_orchestrator_crew
  default_params:
    desired_outcome: INCREASE_REVENUE
    objective_weight: 1.0
    efficiency_weight: 0.1
    margin_weight: 0.0
    direction: maximize
    tone: growth

increase_margin_crew:
  name: "Increase Margin Crew"
  description: |
    Maximize incremental gross profit (incremental_sales × gross_margin_rate).
    Constraints: Spend ≤ budget; optional mix shift constraints
    KPIs: Incremental profit, profit per $ spend, contribution margin
  extends: scenario_orchestrator_crew
  default_params:
    desired_outcome: INCREASE_MARGIN
    objective_weight: 0.7
    efficiency_weight: 0.0
    margin_weight: 0.3
    direction: maximize
    tone: profitability

maintain_revenue_crew:
  name: "Maintain Revenue Crew"
  description: |
    Minimize spend subject to a revenue (or incremental sales) floor.
    Constraints: Incremental sales ≥ target; maintain presence guardrails
    KPIs: Spend savings, efficiency, risk/fragility, forecast error bands
  extends: scenario_orchestrator_crew
  default_params:
    desired_outcome: MAINTAIN_REVENUE
    objective_weight: 1.0
    efficiency_weight: 0.2
    margin_weight: 0.0
    direction: minimize
    tone: efficiency

reduce_cost_crew:
  name: "Reduce Cost Crew"
  description: |
    Minimize spend while protecting priority KPIs (revenue floor + coverage).
    Constraints: Revenue ≥ floor; brand equity constraints; test carveouts
    KPIs: Cost savings, efficiency, coverage proxies, downside risk
  extends: scenario_orchestrator_crew
  default_params:
    desired_outcome: REDUCE_COST
    objective_weight: 1.0
    efficiency_weight: 0.1
    margin_weight: 0.0
    direction: minimize
    tone: cost_reduction

# =============================================================================
# SCENARIO LIBRARY - Parameter patterns for common use cases
# =============================================================================

scenario_library:
  grow_revenue_10_percent:
    name: "Grow Revenue 10%"
    crew: increase_revenue_crew
    params:
      budget_delta_pct: 0.15
      target_revenue_delta_pct: 0.10
      revenue_floor_pct: 0.95

  maximize_efficiency:
    name: "Maximize Efficiency"
    crew: maintain_revenue_crew
    params:
      budget_delta_pct: -0.10
      revenue_floor_pct: 0.98

  scale_high_performers:
    name: "Scale High Performers"
    crew: increase_revenue_crew
    params:
      budget_delta_pct: 0.20
      channel_emphasis:
        search: 1.5
        display: 1.0
        video: 0.8

  reduce_spend_10_percent:
    name: "Reduce Spend 10%"
    crew: reduce_cost_crew
    params:
      budget_delta_pct: -0.10
      revenue_floor_pct: 0.90
      require_test_carveout: true

  stress_test_budget_cut:
    name: "Stress Test: 25% Budget Cut"
    crew: reduce_cost_crew
    params:
      budget_delta_pct: -0.25
      revenue_floor_pct: 0.80
      scenario_type: stress_test

  rebalance_channel_mix:
    name: "Rebalance Channel Mix"
    crew: channel_optimization_crew
    params:
      equalize_marginal_returns: true
      min_channel_share: 0.10
      max_channel_share: 0.40

  shift_to_high_margin:
    name: "Shift to High Margin"
    crew: increase_margin_crew
    params:
      margin_weight: 0.5
      volume_weight: 0.3
      brand_priority_weight: 0.2
