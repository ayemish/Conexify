<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Studio - Workflow Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .decision-card:hover { transform: translateY(-2px); transition: transform 0.2s; }
        .trace-timeline { border-left: 2px solid #e5e7eb; }
        .trace-dot { width: 12px; height: 12px; border-radius: 50%; margin-left: -7px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // API Base URL
        const API_BASE = '/api/v1/llm-studio';
        
        // Icons (using Lucide)
        const Icon = ({ name, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, []);
            return <i data-lucide={name} className={className}></i>;
        };
        
        // Status Badge Component
        const StatusBadge = ({ status }) => {
            const colors = {
                success: 'bg-green-100 text-green-800',
                failure: 'bg-red-100 text-red-800',
                partial: 'bg-yellow-100 text-yellow-800',
                pending: 'bg-gray-100 text-gray-800',
            };
            return (
                <span className={`px-2 py-1 rounded-full text-xs font-medium ${colors[status] || colors.pending}`}>
                    {status}
                </span>
            );
        };
        
        // Quality Score Component
        const QualityScore = ({ score }) => {
            if (score === null || score === undefined) return <span className="text-gray-400">—</span>;
            const color = score >= 0.8 ? 'text-green-600' : score >= 0.5 ? 'text-yellow-600' : 'text-red-600';
            return <span className={`font-medium ${color}`}>{(score * 100).toFixed(0)}%</span>;
        };
        
        // Trace List Component
        const TraceList = ({ traces, onSelect, selectedId }) => (
            <div className="space-y-2">
                {traces.map(trace => (
                    <div 
                        key={trace.trace_id}
                        onClick={() => onSelect(trace)}
                        className={`p-4 bg-white rounded-lg shadow cursor-pointer decision-card
                            ${selectedId === trace.trace_id ? 'ring-2 ring-blue-500' : ''}`}
                    >
                        <div className="flex justify-between items-start">
                            <div>
                                <h3 className="font-medium text-gray-900">{trace.workflow_type}</h3>
                                <p className="text-sm text-gray-500">{trace.asset_id}</p>
                            </div>
                            <StatusBadge status={trace.final_status} />
                        </div>
                        <div className="mt-2 flex items-center gap-4 text-sm text-gray-500">
                            <span>{trace.decision_count} decisions</span>
                            <span>Quality: <QualityScore score={trace.quality_score} /></span>
                            {trace.include_in_training && (
                                <span className="text-green-600">✓ Training</span>
                            )}
                        </div>
                    </div>
                ))}
            </div>
        );
        
        // Decision Detail Component
        const DecisionDetail = ({ decision }) => (
            <div className="bg-white rounded-lg shadow p-6">
                <div className="flex justify-between items-start mb-4">
                    <div>
                        <h3 className="text-lg font-semibold">{decision.decision_type}</h3>
                        <p className="text-sm text-gray-500">{decision.agent_name}</p>
                    </div>
                    <div className="text-right">
                        <div className="text-sm text-gray-500">Confidence</div>
                        <div className="text-xl font-bold">{(decision.confidence * 100).toFixed(0)}%</div>
                    </div>
                </div>
                
                <div className="mb-4">
                    <h4 className="font-medium text-gray-700 mb-2">Reasoning</h4>
                    <ol className="list-decimal list-inside space-y-1 text-sm text-gray-600">
                        {decision.reasoning_steps.map((step, i) => (
                            <li key={i}>{step}</li>
                        ))}
                    </ol>
                </div>
                
                <div className="mb-4">
                    <h4 className="font-medium text-gray-700 mb-2">Decision</h4>
                    <p className="text-gray-800">{decision.decision}</p>
                </div>
                
                {decision.outcome_status && (
                    <div className="mb-4">
                        <h4 className="font-medium text-gray-700 mb-2">Outcome</h4>
                        <div className="flex items-center gap-2">
                            <StatusBadge status={decision.outcome_status} />
                            <span className="text-gray-600">{decision.outcome_summary}</span>
                        </div>
                    </div>
                )}
            </div>
        );
        
        // Annotation Form Component
        const AnnotationForm = ({ decisionId, onSubmit }) => {
            const [formData, setFormData] = useState({
                annotation_type: 'correct',
                annotator_id: '',
                notes: '',
                quality_score: null,
            });
            
            const handleSubmit = (e) => {
                e.preventDefault();
                onSubmit(formData);
            };
            
            return (
                <form onSubmit={handleSubmit} className="bg-gray-50 rounded-lg p-4 space-y-4">
                    <h4 className="font-medium">Add Annotation</h4>
                    
                    <div>
                        <label className="block text-sm font-medium text-gray-700">Type</label>
                        <select 
                            value={formData.annotation_type}
                            onChange={e => setFormData({...formData, annotation_type: e.target.value})}
                            className="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                        >
                            <option value="correct">Correct</option>
                            <option value="incorrect">Incorrect</option>
                            <option value="partially_correct">Partially Correct</option>
                            <option value="exemplary">Exemplary (Use for Training)</option>
                            <option value="do_not_train">Do Not Train</option>
                        </select>
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium text-gray-700">Annotator ID</label>
                        <input 
                            type="text"
                            value={formData.annotator_id}
                            onChange={e => setFormData({...formData, annotator_id: e.target.value})}
                            className="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                            placeholder="your.email@company.com"
                        />
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium text-gray-700">Notes</label>
                        <textarea 
                            value={formData.notes}
                            onChange={e => setFormData({...formData, notes: e.target.value})}
                            className="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                            rows={3}
                        />
                    </div>
                    
                    <button 
                        type="submit"
                        className="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700"
                    >
                        Submit Annotation
                    </button>
                </form>
            );
        };
        
        // Training Example Preview Component
        const TrainingExamplePreview = ({ example }) => (
            <div className="bg-gray-900 rounded-lg p-4 text-sm font-mono">
                <div className="mb-4">
                    <div className="text-blue-400 mb-1">// System Prompt</div>
                    <pre className="text-gray-300">{example?.conversation?.messages?.[0]?.content}</pre>
                </div>
                <div className="mb-4">
                    <div className="text-green-400 mb-1">// User Input</div>
                    <pre className="text-gray-300">{example?.conversation?.messages?.[1]?.content}</pre>
                </div>
                <div>
                    <div className="text-yellow-400 mb-1">// Assistant Output</div>
                    <pre className="text-gray-300">{example?.conversation?.messages?.[2]?.content}</pre>
                </div>
            </div>
        );
        
        // Stats Dashboard Component
        const StatsDashboard = ({ stats }) => (
            <div className="grid grid-cols-4 gap-4 mb-6">
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-2xl font-bold">{stats?.total_traces || 0}</div>
                    <div className="text-sm text-gray-500">Total Traces</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-2xl font-bold">{stats?.total_decisions || 0}</div>
                    <div className="text-sm text-gray-500">Total Decisions</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-2xl font-bold text-green-600">{stats?.trainable_decisions || 0}</div>
                    <div className="text-sm text-gray-500">Trainable</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-2xl font-bold text-blue-600">{stats?.verified_decisions || 0}</div>
                    <div className="text-sm text-gray-500">Human Verified</div>
                </div>
            </div>
        );
        
        // Export Panel Component
        const ExportPanel = ({ onExport }) => {
            const [format, setFormat] = useState('jsonl');
            const [filters, setFilters] = useState({
                only_successful: true,
                only_human_verified: false,
                limit: 1000,
            });
            
            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <h3 className="text-lg font-semibold mb-4">Export Training Data</h3>
                    
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700">Format</label>
                            <select 
                                value={format}
                                onChange={e => setFormat(e.target.value)}
                                className="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                            >
                                <option value="jsonl">JSONL</option>
                                <option value="conversation">OpenAI Conversation</option>
                                <option value="alpaca">Alpaca</option>
                                <option value="sharegpt">ShareGPT</option>
                            </select>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <label className="flex items-center">
                                <input 
                                    type="checkbox"
                                    checked={filters.only_successful}
                                    onChange={e => setFilters({...filters, only_successful: e.target.checked})}
                                    className="rounded border-gray-300"
                                />
                                <span className="ml-2 text-sm">Only Successful</span>
                            </label>
                            
                            <label className="flex items-center">
                                <input 
                                    type="checkbox"
                                    checked={filters.only_human_verified}
                                    onChange={e => setFilters({...filters, only_human_verified: e.target.checked})}
                                    className="rounded border-gray-300"
                                />
                                <span className="ml-2 text-sm">Only Human Verified</span>
                            </label>
                        </div>
                        
                        <div>
                            <label className="block text-sm font-medium text-gray-700">Limit</label>
                            <input 
                                type="number"
                                value={filters.limit}
                                onChange={e => setFilters({...filters, limit: parseInt(e.target.value)})}
                                className="mt-1 block w-full rounded-md border-gray-300 shadow-sm"
                            />
                        </div>
                        
                        <button 
                            onClick={() => onExport(format, filters)}
                            className="w-full bg-green-600 text-white py-2 px-4 rounded-md hover:bg-green-700"
                        >
                            Export Training Data
                        </button>
                    </div>
                </div>
            );
        };
        
        // Main App Component
        const App = () => {
            const [traces, setTraces] = useState([]);
            const [selectedTrace, setSelectedTrace] = useState(null);
            const [decisions, setDecisions] = useState([]);
            const [selectedDecision, setSelectedDecision] = useState(null);
            const [trainingExample, setTrainingExample] = useState(null);
            const [stats, setStats] = useState(null);
            const [activeTab, setActiveTab] = useState('explore');
            
            // Mock data for demo (replace with API calls)
            useEffect(() => {
                // Simulate loading traces
                setTraces([
                    {
                        trace_id: 'TRC-demo-001',
                        workflow_type: 'autopilot_run',
                        asset_id: 'RTU-001',
                        final_status: 'success',
                        decision_count: 5,
                        quality_score: 0.85,
                        include_in_training: true,
                    },
                    {
                        trace_id: 'TRC-demo-002',
                        workflow_type: 'fault_detection',
                        asset_id: 'CHILLER-002',
                        final_status: 'partial',
                        decision_count: 3,
                        quality_score: 0.65,
                        include_in_training: true,
                    },
                ]);
                
                setStats({
                    total_traces: 156,
                    total_decisions: 892,
                    trainable_decisions: 743,
                    verified_decisions: 234,
                });
            }, []);
            
            const handleSelectTrace = (trace) => {
                setSelectedTrace(trace);
                // Load decisions for this trace
                setDecisions([
                    {
                        decision_id: 'DEC-001',
                        decision_type: 'fault_detection',
                        agent_name: 'FaultHypothesisAgent',
                        confidence: 0.87,
                        decision: 'Detected condenser fouling based on elevated discharge pressure',
                        reasoning_steps: [
                            'Discharge pressure 15% above expected',
                            'Condenser fan operating normally',
                            'No refrigerant charge issues detected',
                            'Pattern matches condenser fouling signature',
                        ],
                        outcome_status: 'success',
                        outcome_summary: 'Fault confirmed by technician',
                    },
                ]);
            };
            
            const handleSelectDecision = (decision) => {
                setSelectedDecision(decision);
                setTrainingExample({
                    conversation: {
                        messages: [
                            { role: 'system', content: 'You are an expert HVAC/R fault detection system...' },
                            { role: 'user', content: 'Asset: RTU-001\nTelemetry: discharge_pressure: 285 psi...' },
                            { role: 'assistant', content: 'Reasoning:\n1. Discharge pressure elevated...\n\nDecision: Condenser fouling detected' },
                        ],
                    },
                });
            };
            
            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-white shadow">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-gray-900">LLM Studio</h1>
                                <nav className="flex gap-4">
                                    <button 
                                        onClick={() => setActiveTab('explore')}
                                        className={`px-4 py-2 rounded ${activeTab === 'explore' ? 'bg-blue-100 text-blue-700' : 'text-gray-600'}`}
                                    >
                                        Explore Workflows
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('annotate')}
                                        className={`px-4 py-2 rounded ${activeTab === 'annotate' ? 'bg-blue-100 text-blue-700' : 'text-gray-600'}`}
                                    >
                                        Annotate
                                    </button>
                                    <button 
                                        onClick={() => setActiveTab('export')}
                                        className={`px-4 py-2 rounded ${activeTab === 'export' ? 'bg-blue-100 text-blue-700' : 'text-gray-600'}`}
                                    >
                                        Export
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </header>
                    
                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 py-6">
                        <StatsDashboard stats={stats} />
                        
                        {activeTab === 'explore' && (
                            <div className="grid grid-cols-3 gap-6">
                                {/* Trace List */}
                                <div>
                                    <h2 className="text-lg font-semibold mb-4">Workflow Traces</h2>
                                    <TraceList 
                                        traces={traces} 
                                        onSelect={handleSelectTrace}
                                        selectedId={selectedTrace?.trace_id}
                                    />
                                </div>
                                
                                {/* Decisions */}
                                <div>
                                    <h2 className="text-lg font-semibold mb-4">Decisions</h2>
                                    {selectedTrace ? (
                                        <div className="space-y-2">
                                            {decisions.map(d => (
                                                <div 
                                                    key={d.decision_id}
                                                    onClick={() => handleSelectDecision(d)}
                                                    className={`p-3 bg-white rounded-lg shadow cursor-pointer
                                                        ${selectedDecision?.decision_id === d.decision_id ? 'ring-2 ring-blue-500' : ''}`}
                                                >
                                                    <div className="font-medium">{d.decision_type}</div>
                                                    <div className="text-sm text-gray-500">{d.agent_name}</div>
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <p className="text-gray-500">Select a trace to view decisions</p>
                                    )}
                                </div>
                                
                                {/* Decision Detail */}
                                <div>
                                    <h2 className="text-lg font-semibold mb-4">Detail</h2>
                                    {selectedDecision ? (
                                        <div className="space-y-4">
                                            <DecisionDetail decision={selectedDecision} />
                                            <div className="bg-white rounded-lg shadow p-4">
                                                <h4 className="font-medium mb-2">Training Example Preview</h4>
                                                <TrainingExamplePreview example={trainingExample} />
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-gray-500">Select a decision to view details</p>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'annotate' && selectedDecision && (
                            <div className="grid grid-cols-2 gap-6">
                                <DecisionDetail decision={selectedDecision} />
                                <AnnotationForm 
                                    decisionId={selectedDecision.decision_id}
                                    onSubmit={(data) => console.log('Annotation:', data)}
                                />
                            </div>
                        )}
                        
                        {activeTab === 'export' && (
                            <div className="max-w-xl">
                                <ExportPanel onExport={(format, filters) => console.log('Export:', format, filters)} />
                            </div>
                        )}
                    </main>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
