<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Queue - Human-in-the-Loop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .queue-item:hover { transform: translateX(4px); transition: transform 0.2s; }
        .risk-critical { border-left: 4px solid #dc2626; }
        .risk-high { border-left: 4px solid #f97316; }
        .risk-medium { border-left: 4px solid #eab308; }
        .risk-low { border-left: 4px solid #22c55e; }
        .pulse-urgent { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        
        const API_BASE = '/api/v1/approval-queue';
        
        // Risk level colors
        const riskColors = {
            EXTREME: { bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-500' },
            HIGH: { bg: 'bg-orange-100', text: 'text-orange-800', border: 'border-orange-500' },
            MEDIUM: { bg: 'bg-yellow-100', text: 'text-yellow-800', border: 'border-yellow-500' },
            LOW: { bg: 'bg-green-100', text: 'text-green-800', border: 'border-green-500' },
        };
        
        // Validation status badges
        const ValidationBadge = ({ status }) => {
            const colors = {
                passed: 'bg-green-100 text-green-800',
                warning: 'bg-yellow-100 text-yellow-800',
                failed: 'bg-red-100 text-red-800',
                needs_review: 'bg-blue-100 text-blue-800',
            };
            return (
                <span className={`px-2 py-1 rounded-full text-xs font-medium ${colors[status] || 'bg-gray-100'}`}>
                    {status?.replace('_', ' ').toUpperCase()}
                </span>
            );
        };
        
        // Stats Dashboard
        const StatsDashboard = ({ stats }) => (
            <div className="grid grid-cols-5 gap-4 mb-6">
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-3xl font-bold text-blue-600">{stats?.pending_count || 0}</div>
                    <div className="text-sm text-gray-500">Pending Review</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-3xl font-bold">{stats?.total_items || 0}</div>
                    <div className="text-sm text-gray-500">Total Items</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-3xl font-bold text-green-600">{stats?.completed_reviews || 0}</div>
                    <div className="text-sm text-gray-500">Completed</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-3xl font-bold">{Math.round(stats?.avg_review_time_seconds || 0)}s</div>
                    <div className="text-sm text-gray-500">Avg Review Time</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                    <div className="text-3xl font-bold text-purple-600">
                        {Math.round((stats?.llm_explanation_helpful_rate || 0) * 100)}%
                    </div>
                    <div className="text-sm text-gray-500">LLM Helpful</div>
                </div>
            </div>
        );
        
        // Queue Item Card
        const QueueItemCard = ({ item, onSelect, isSelected }) => {
            const riskStyle = riskColors[item.risk_tier] || riskColors.MEDIUM;
            const isUrgent = item.risk_tier === 'EXTREME' || item.risk_tier === 'HIGH';
            
            return (
                <div 
                    onClick={() => onSelect(item)}
                    className={`queue-item bg-white rounded-lg shadow p-4 cursor-pointer mb-3 
                        risk-${item.risk_tier.toLowerCase()}
                        ${isSelected ? 'ring-2 ring-blue-500' : ''}
                        ${isUrgent ? 'pulse-urgent' : ''}`}
                >
                    <div className="flex justify-between items-start mb-2">
                        <div>
                            <h3 className="font-semibold text-gray-900">{item.asset_id}</h3>
                            <p className="text-sm text-gray-500">{item.action_summary}</p>
                        </div>
                        <span className={`px-2 py-1 rounded text-xs font-medium ${riskStyle.bg} ${riskStyle.text}`}>
                            {item.risk_tier}
                        </span>
                    </div>
                    
                    <div className="flex items-center gap-3 text-xs text-gray-500">
                        <span>Priority: {item.priority}</span>
                        {item.has_validation && (
                            <ValidationBadge status={item.validation_status} />
                        )}
                        {item.assigned_to && (
                            <span className="text-blue-600">Assigned: {item.assigned_to}</span>
                        )}
                    </div>
                    
                    <div className="mt-2 flex gap-2">
                        {item.has_explanation && (
                            <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded">
                                ✓ LLM Explanation
                            </span>
                        )}
                        {!item.has_explanation && (
                            <span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded">
                                ⏳ Generating...
                            </span>
                        )}
                    </div>
                </div>
            );
        };
        
        // LLM Explanation Panel
        const ExplanationPanel = ({ explanation }) => {
            if (!explanation) return <div className="text-gray-500 italic">Generating explanation...</div>;
            
            return (
                <div className="space-y-4">
                    <div>
                        <h3 className="text-lg font-bold text-gray-900">{explanation.title}</h3>
                        <p className="text-gray-600 mt-1">{explanation.summary}</p>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-blue-50 rounded-lg p-3">
                            <h4 className="font-medium text-blue-900 mb-1">What Happened</h4>
                            <p className="text-sm text-blue-800">{explanation.what_happened}</p>
                        </div>
                        <div className="bg-green-50 rounded-lg p-3">
                            <h4 className="font-medium text-green-900 mb-1">What Will Happen</h4>
                            <p className="text-sm text-green-800">{explanation.what_will_happen}</p>
                        </div>
                    </div>
                    
                    <div className="bg-purple-50 rounded-lg p-3">
                        <h4 className="font-medium text-purple-900 mb-1">Why Recommended</h4>
                        <p className="text-sm text-purple-800">{explanation.why_recommended}</p>
                    </div>
                    
                    <div className="bg-amber-50 rounded-lg p-3">
                        <h4 className="font-medium text-amber-900 mb-1">Expected Outcome</h4>
                        <p className="text-sm text-amber-800">{explanation.expected_outcome}</p>
                    </div>
                    
                    {explanation.risk_assessment && (
                        <div className="border rounded-lg p-3">
                            <h4 className="font-medium mb-2">Risk Assessment</h4>
                            <div className="flex gap-4 text-sm">
                                <span className={`font-medium ${
                                    explanation.risk_assessment.overall_risk === 'critical' ? 'text-red-600' :
                                    explanation.risk_assessment.overall_risk === 'high' ? 'text-orange-600' :
                                    explanation.risk_assessment.overall_risk === 'medium' ? 'text-yellow-600' :
                                    'text-green-600'
                                }`}>
                                    {explanation.risk_assessment.overall_risk?.toUpperCase()} RISK
                                </span>
                            </div>
                            {explanation.risk_assessment.risk_factors?.length > 0 && (
                                <div className="mt-2">
                                    <span className="text-xs font-medium text-gray-600">Risk Factors:</span>
                                    <ul className="text-xs text-gray-600 list-disc list-inside">
                                        {explanation.risk_assessment.risk_factors.map((f, i) => (
                                            <li key={i}>{f}</li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                            {explanation.risk_assessment.mitigations?.length > 0 && (
                                <div className="mt-2">
                                    <span className="text-xs font-medium text-green-600">Mitigations:</span>
                                    <ul className="text-xs text-green-600 list-disc list-inside">
                                        {explanation.risk_assessment.mitigations.map((m, i) => (
                                            <li key={i}>{m}</li>
                                        ))}
                                    </ul>
                                </div>
                            )}
                        </div>
                    )}
                    
                    <div className="flex items-center gap-4 text-xs text-gray-500">
                        <span>Confidence: {Math.round((explanation.confidence || 0) * 100)}%</span>
                        <span>Generated: {new Date(explanation.generated_at).toLocaleTimeString()}</span>
                    </div>
                </div>
            );
        };
        
        // Validation Panel
        const ValidationPanel = ({ validation }) => {
            if (!validation) return <div className="text-gray-500 italic">Running validation...</div>;
            
            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-3">
                        <ValidationBadge status={validation.status} />
                        <span className="text-sm text-gray-600">
                            Confidence: {Math.round((validation.validation_confidence || 0) * 100)}%
                        </span>
                    </div>
                    
                    {validation.errors?.length > 0 && (
                        <div className="bg-red-50 rounded-lg p-3">
                            <h4 className="font-medium text-red-900 mb-1">Errors</h4>
                            <ul className="text-sm text-red-800 list-disc list-inside">
                                {validation.errors.map((e, i) => <li key={i}>{e}</li>)}
                            </ul>
                        </div>
                    )}
                    
                    {validation.warnings?.length > 0 && (
                        <div className="bg-yellow-50 rounded-lg p-3">
                            <h4 className="font-medium text-yellow-900 mb-1">Warnings</h4>
                            <ul className="text-sm text-yellow-800 list-disc list-inside">
                                {validation.warnings.map((w, i) => <li key={i}>{w}</li>)}
                            </ul>
                        </div>
                    )}
                    
                    {!validation.safety_checks_passed && (
                        <div className="bg-red-100 border border-red-300 rounded-lg p-3">
                            <h4 className="font-bold text-red-900">⚠️ Safety Concerns</h4>
                            <ul className="text-sm text-red-800 mt-1">
                                {validation.safety_concerns?.map((c, i) => <li key={i}>{c}</li>)}
                            </ul>
                        </div>
                    )}
                    
                    {validation.recommendations?.length > 0 && (
                        <div className="bg-blue-50 rounded-lg p-3">
                            <h4 className="font-medium text-blue-900 mb-1">Recommendations</h4>
                            <ul className="text-sm text-blue-800 list-disc list-inside">
                                {validation.recommendations.map((r, i) => <li key={i}>{r}</li>)}
                            </ul>
                        </div>
                    )}
                    
                    <details className="text-sm">
                        <summary className="cursor-pointer text-gray-600">
                            View {validation.checks?.length || 0} validation checks
                        </summary>
                        <div className="mt-2 space-y-1">
                            {validation.checks?.map((check, i) => (
                                <div key={i} className={`flex items-center gap-2 p-1 rounded ${
                                    check.passed ? 'bg-green-50' : 'bg-red-50'
                                }`}>
                                    <span>{check.passed ? '✓' : '✗'}</span>
                                    <span className="font-medium">{check.name}</span>
                                    <span className="text-gray-600">- {check.message}</span>
                                </div>
                            ))}
                        </div>
                    </details>
                </div>
            );
        };
        
        // Approval Form
        const ApprovalForm = ({ item, onApprove, onReject, onEscalate }) => {
            const [notes, setNotes] = useState('');
            const [reason, setReason] = useState('');
            const [llmHelpful, setLlmHelpful] = useState(null);
            const [llmAccurate, setLlmAccurate] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const handleApprove = async () => {
                setIsSubmitting(true);
                await onApprove({ notes, llm_explanation_helpful: llmHelpful, llm_validation_accurate: llmAccurate });
                setIsSubmitting(false);
            };
            
            const handleReject = async () => {
                if (!reason) { alert('Please provide a rejection reason'); return; }
                setIsSubmitting(true);
                await onReject({ reason, notes, llm_explanation_helpful: llmHelpful, llm_validation_accurate: llmAccurate });
                setIsSubmitting(false);
            };
            
            return (
                <div className="bg-white rounded-lg shadow p-6 space-y-4">
                    <h3 className="text-lg font-semibold">Your Decision</h3>
                    
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
                        <textarea 
                            value={notes}
                            onChange={e => setNotes(e.target.value)}
                            className="w-full rounded-md border-gray-300 shadow-sm p-2 border"
                            rows={2}
                            placeholder="Add any notes about your decision..."
                        />
                    </div>
                    
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">
                            Rejection Reason (required if rejecting)
                        </label>
                        <input 
                            type="text"
                            value={reason}
                            onChange={e => setReason(e.target.value)}
                            className="w-full rounded-md border-gray-300 shadow-sm p-2 border"
                            placeholder="Why are you rejecting this action?"
                        />
                    </div>
                    
                    <div className="border-t pt-4">
                        <p className="text-sm font-medium text-gray-700 mb-2">LLM Feedback (helps improve the system)</p>
                        <div className="flex gap-6">
                            <div>
                                <span className="text-sm text-gray-600">Was the explanation helpful?</span>
                                <div className="flex gap-2 mt-1">
                                    <button 
                                        onClick={() => setLlmHelpful(true)}
                                        className={`px-3 py-1 rounded text-sm ${llmHelpful === true ? 'bg-green-500 text-white' : 'bg-gray-100'}`}
                                    >Yes</button>
                                    <button 
                                        onClick={() => setLlmHelpful(false)}
                                        className={`px-3 py-1 rounded text-sm ${llmHelpful === false ? 'bg-red-500 text-white' : 'bg-gray-100'}`}
                                    >No</button>
                                </div>
                            </div>
                            <div>
                                <span className="text-sm text-gray-600">Was the validation accurate?</span>
                                <div className="flex gap-2 mt-1">
                                    <button 
                                        onClick={() => setLlmAccurate(true)}
                                        className={`px-3 py-1 rounded text-sm ${llmAccurate === true ? 'bg-green-500 text-white' : 'bg-gray-100'}`}
                                    >Yes</button>
                                    <button 
                                        onClick={() => setLlmAccurate(false)}
                                        className={`px-3 py-1 rounded text-sm ${llmAccurate === false ? 'bg-red-500 text-white' : 'bg-gray-100'}`}
                                    >No</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex gap-3 pt-4 border-t">
                        <button 
                            onClick={handleApprove}
                            disabled={isSubmitting}
                            className="flex-1 bg-green-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-green-700 disabled:opacity-50"
                        >
                            ✓ Approve Action
                        </button>
                        <button 
                            onClick={handleReject}
                            disabled={isSubmitting}
                            className="flex-1 bg-red-600 text-white py-3 px-4 rounded-lg font-medium hover:bg-red-700 disabled:opacity-50"
                        >
                            ✗ Reject
                        </button>
                        <button 
                            onClick={onEscalate}
                            disabled={isSubmitting}
                            className="bg-yellow-500 text-white py-3 px-4 rounded-lg font-medium hover:bg-yellow-600 disabled:opacity-50"
                        >
                            ↑ Escalate
                        </button>
                    </div>
                </div>
            );
        };
        
        // Main App
        const App = () => {
            const [queue, setQueue] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [itemDetail, setItemDetail] = useState(null);
            const [stats, setStats] = useState(null);
            const [filter, setFilter] = useState({ status: 'ready', risk_tier: '' });
            const [reviewerId] = useState('demo-user@company.com');
            
            // Load queue (mock data for demo)
            useEffect(() => {
                setQueue([
                    {
                        item_id: 'QI-demo-001',
                        approval_id: 'APR-001',
                        run_id: 'RUN-001',
                        asset_id: 'RTU-BLDG-A-01',
                        site_id: 'SITE-001',
                        item_type: 'action_approval',
                        risk_tier: 'HIGH',
                        priority: 85,
                        action_summary: 'Reduce compressor capacity to 75% to prevent high discharge temp',
                        status: 'ready',
                        created_at: new Date().toISOString(),
                        has_explanation: true,
                        has_validation: true,
                        validation_status: 'warning',
                    },
                    {
                        item_id: 'QI-demo-002',
                        approval_id: 'APR-002',
                        run_id: 'RUN-002',
                        asset_id: 'CHILLER-01',
                        site_id: 'SITE-001',
                        item_type: 'action_approval',
                        risk_tier: 'MEDIUM',
                        priority: 60,
                        action_summary: 'Adjust condenser fan speed from 80% to 95%',
                        status: 'ready',
                        created_at: new Date().toISOString(),
                        has_explanation: true,
                        has_validation: true,
                        validation_status: 'passed',
                    },
                ]);
                
                setStats({
                    pending_count: 5,
                    total_items: 23,
                    completed_reviews: 18,
                    avg_review_time_seconds: 45,
                    llm_explanation_helpful_rate: 0.89,
                });
            }, []);
            
            const handleSelectItem = (item) => {
                setSelectedItem(item);
                // Load detail (mock)
                setItemDetail({
                    ...item,
                    proposed_actions: [
                        { type: 'WRITE_POINT', point_id: 'compressor_capacity', value: 75, ttl_seconds: 3600 }
                    ],
                    explanation: {
                        title: 'High Discharge Temperature - Capacity Reduction Required',
                        summary: 'The system detected elevated compressor discharge temperature on RTU-BLDG-A-01. Reducing capacity to 75% will prevent potential compressor damage while maintaining partial cooling.',
                        what_happened: 'Compressor discharge temperature reached 215°F, exceeding the 200°F threshold. This indicates the compressor is working harder than optimal, possibly due to high ambient temperature or reduced condenser efficiency.',
                        what_will_happen: 'The autopilot will reduce compressor capacity from 100% to 75%. This reduces the heat of compression while maintaining partial cooling output. The change will auto-revert after 1 hour.',
                        why_recommended: 'Capacity reduction is the standard first response to high discharge temps. It protects the compressor from damage while maintaining space temperature within acceptable limits.',
                        expected_outcome: 'Discharge temperature should decrease to below 190°F within 10-15 minutes. Zone temperature may increase by 2-3°F temporarily.',
                        risk_assessment: {
                            overall_risk: 'medium',
                            risk_factors: ['Compressor stress if not addressed', 'Temporary comfort impact'],
                            mitigations: ['Auto-revert after 1 hour', 'Continuous monitoring', 'Escalation if condition worsens'],
                        },
                        confidence: 0.87,
                        generated_at: new Date().toISOString(),
                    },
                    validation: {
                        status: 'warning',
                        validation_confidence: 0.82,
                        errors: [],
                        warnings: ['Action during peak cooling hours may affect comfort'],
                        safety_checks_passed: true,
                        recommendations: ['Consider warning building occupants of temporary temperature increase'],
                        checks: [
                            { name: 'Value range check', passed: true, message: '75% within 0-100% range' },
                            { name: 'TTL configured', passed: true, message: 'Auto-revert after 3600s' },
                            { name: 'Peak hours check', passed: false, message: 'Action during peak hours (2pm)', severity: 'warning' },
                        ],
                    },
                });
            };
            
            const handleApprove = async (data) => {
                console.log('Approving:', selectedItem.item_id, data);
                alert('Action approved! (Demo mode)');
                setSelectedItem(null);
            };
            
            const handleReject = async (data) => {
                console.log('Rejecting:', selectedItem.item_id, data);
                alert('Action rejected! (Demo mode)');
                setSelectedItem(null);
            };
            
            const handleEscalate = async () => {
                console.log('Escalating:', selectedItem.item_id);
                alert('Action escalated! (Demo mode)');
                setSelectedItem(null);
            };
            
            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <header className="bg-white shadow">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <h1 className="text-2xl font-bold text-gray-900">Approval Queue</h1>
                                    <p className="text-sm text-gray-500">Human-in-the-Loop Workflow Review</p>
                                </div>
                                <div className="flex items-center gap-4">
                                    <span className="text-sm text-gray-600">Reviewer: {reviewerId}</span>
                                    <select 
                                        value={filter.status}
                                        onChange={e => setFilter({...filter, status: e.target.value})}
                                        className="rounded-md border-gray-300 shadow-sm text-sm"
                                    >
                                        <option value="">All Status</option>
                                        <option value="ready">Ready for Review</option>
                                        <option value="in_review">In Review</option>
                                        <option value="escalated">Escalated</option>
                                    </select>
                                    <select 
                                        value={filter.risk_tier}
                                        onChange={e => setFilter({...filter, risk_tier: e.target.value})}
                                        className="rounded-md border-gray-300 shadow-sm text-sm"
                                    >
                                        <option value="">All Risk Levels</option>
                                        <option value="EXTREME">Extreme</option>
                                        <option value="HIGH">High</option>
                                        <option value="MEDIUM">Medium</option>
                                        <option value="LOW">Low</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 py-6">
                        <StatsDashboard stats={stats} />
                        
                        <div className="grid grid-cols-12 gap-6">
                            {/* Queue List */}
                            <div className="col-span-4">
                                <h2 className="text-lg font-semibold mb-4">
                                    Pending Items ({queue.length})
                                </h2>
                                {queue.map(item => (
                                    <QueueItemCard 
                                        key={item.item_id}
                                        item={item}
                                        onSelect={handleSelectItem}
                                        isSelected={selectedItem?.item_id === item.item_id}
                                    />
                                ))}
                            </div>
                            
                            {/* Detail Panel */}
                            <div className="col-span-8">
                                {itemDetail ? (
                                    <div className="space-y-6">
                                        {/* Explanation */}
                                        <div className="bg-white rounded-lg shadow p-6">
                                            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                                <span className="text-purple-600">🤖</span>
                                                LLM Explanation
                                            </h2>
                                            <ExplanationPanel explanation={itemDetail.explanation} />
                                        </div>
                                        
                                        {/* Validation */}
                                        <div className="bg-white rounded-lg shadow p-6">
                                            <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">
                                                <span className="text-blue-600">✓</span>
                                                Validation Results
                                            </h2>
                                            <ValidationPanel validation={itemDetail.validation} />
                                        </div>
                                        
                                        {/* Proposed Actions */}
                                        <div className="bg-white rounded-lg shadow p-6">
                                            <h2 className="text-lg font-semibold mb-4">Proposed Actions</h2>
                                            <div className="bg-gray-900 rounded-lg p-4">
                                                <pre className="text-green-400 text-sm">
                                                    {JSON.stringify(itemDetail.proposed_actions, null, 2)}
                                                </pre>
                                            </div>
                                        </div>
                                        
                                        {/* Approval Form */}
                                        <ApprovalForm 
                                            item={itemDetail}
                                            onApprove={handleApprove}
                                            onReject={handleReject}
                                            onEscalate={handleEscalate}
                                        />
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-lg shadow p-12 text-center text-gray-500">
                                        <p className="text-lg">Select an item from the queue to review</p>
                                        <p className="text-sm mt-2">Items are sorted by priority and urgency</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                </div>
            );
        };
        
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
